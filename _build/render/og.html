<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--slate);color:var(--on-slate)}
.og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:600px 600px}
.l{padding:64px 0 56px 72px;display:flex;flex-direction:column}
.wm{font-weight:300;letter-spacing:.24em;text-transform:uppercase;font-size:17px;color:var(--on-slate)}
.wm small{display:block;letter-spacing:.42em;font-size:10px;color:var(--on-slate-2);margin-top:8px}
.kick{margin-top:auto;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1{font-weight:600;font-size:58px;line-height:1.04;letter-spacing:-.02em;margin:14px 0 0;max-width:13ch}
p{font-size:20px;font-weight:300;color:var(--on-slate-2);margin:20px 0 0;max-width:30ch;line-height:1.4}
.r{display:grid;place-items:center}
canvas{width:560px;height:auto;aspect-ratio:1000/942}
</style></head>
<body data-page="og"><div class="og"><div class="l"><div class="wm">Pakistan Evidence<small>Catalogue</small></div>
<div class="kick" id="k"></div><h1 id="t"></h1><p id="s"></p></div><div class="r"><canvas id="m"></canvas></div></div>
<script src="../../data/catalogue.js"></script><script src="../../data/geo.js"></script><script src="../../assets/js/map.js"></script>
<script>
var q=new URLSearchParams(location.search).get('p'), M=PECMap;
var map=new M.Map(document.getElementById('m'),{});
if(q){var p=PEC.programmes.find(function(x){return x.id===q});
 document.getElementById('k').textContent=p.id+'   '+p.macro;
 document.getElementById('t').textContent=p.short;
 var sp=p.start_y?(p.end_y&&p.end_y!==p.start_y?p.start_y+'–'+p.end_y:p.start_y):'';
 document.getElementById('s').textContent=(sp?sp+'. ':'')+p.unit_class+' rollout, '+p.n_outcomes+' outcomes mapped to datasets.';
 map.set({mode:'footprint',prog:p,upTo:null});
}else{
 document.getElementById('k').textContent=PEC.meta.counts.programmes+' programmes';
 document.getElementById('t').textContent='Pakistan, one district at a time';
 document.getElementById('s').textContent='Rollout dates, outcomes and datasets for causal evaluation.';
 map.set({mode:'density',yearIndex:PEC.meta.years.length-1});
}
document.fonts.ready.then(function(){document.body.setAttribute('data-ready','1')});
</script></body></html>
